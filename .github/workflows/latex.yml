name: Build & Publish CV PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Build main.tex -> cv.pdf
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mv main.pdf cv.pdf

      - name: Publish cv.pdf to release tag cv-latest
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: cv-latest
          name: "CV (latest)"
          files: cv.pdf
